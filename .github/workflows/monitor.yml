name: Mercari Monitor

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mercari-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      # 報告圖顯示日文卡名用
      - run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 選用：設定後會用 Claude 看照片判讀卡況（會產生 API 費用）
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python monitor.py

      - name: Save seen.json
        run: |
          git config user.name "mercari-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet && exit 0
          git commit -m "update seen"
          # 跑的期間 main 可能有新 commit，失敗就重抓再推（最多 4 次）
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
