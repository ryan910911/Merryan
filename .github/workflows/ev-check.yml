name: EV Check

# 手動評估任一張 Mercari 商品：Actions → EV Check → Run workflow，貼上網址
# 結果會傳到 Telegram，也會顯示在這次執行的 Summary
on:
  workflow_dispatch:
    inputs:
      url:
        description: Mercari 商品網址
        required: true
      card:
        description: cards.yaml 卡種 key（空白 = 依標題自動挑）
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Evaluate
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          URL: ${{ inputs.url }}
          CARD: ${{ inputs.card }}
        run: |
          set -o pipefail
          python ev_check.py "$URL" ${CARD:+--card "$CARD"} --report report.png --telegram | tee out.txt
          { echo '```'; cat out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ev-report
          path: |
            report.png
            out.txt
          if-no-files-found: ignore
