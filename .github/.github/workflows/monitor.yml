name: Mercari Monitor

on:
  schedule:
    - cron: "*/30 * * * *"   # 每小時一次；公開 repo 可改成 "*/30 * * * *"
  workflow_dispatch:       # 允許手動執行

permissions:
  contents: write

concurrency:
  group: mercari-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Save seen.json
        run: |
          git config user.name "mercari-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "update seen" && git pull --rebase -X theirs && git push)
