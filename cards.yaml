    raw_price: "45800 JPY"          # SNKRDUNK 刊登價（可能是最低價而非成交）
    raw_price_played: "211.25 USD"  # PriceCharting 未鑑定
    prices: {10: "4205 USD", 9: "692.51 USD", 8: "387.57 USD", 7: "255 USD"}   # PriceCharting；PSA 10 最近成交 $4,400（2026-08-29）
