# Mercari 監控設定
# 新增/刪除品項只要改 items 清單即可

defaults:
  # 商品狀態：1 新品未使用 / 2 未使用に近い / 3 目立った傷や汚れなし
  #          4 やや傷や汚れあり / 5 傷や汚れあり / 6 全體的に狀態が悪い
  # 預設剔除 6（嚴重損傷）；想更嚴格可拿掉 5，只要新品就只留 [1]
  conditions: [1, 2, 3, 4, 5]
  # 價格上限（日圓），留空 = 不限；單一品項也可自己設 max_price
  max_price:
  # 品項有 card（對應 cards.yaml）時，通知會附鑑定期望值判斷
  # annotate = 全部通知並附判斷；worth_only = 只通知「建議買進／可考慮」
  ev_notify: annotate
  # auto = 依標題比對 cards.yaml 全部卡（match），對到才評估；個別品項可寫 card: 卡種 key 指定
  card: auto
  # 標題含這些字的商品一律略過（嚴重損傷、破損、零件用）
  exclude_words:
    - ジャンク
    - 破損
    - 破れ
    - 大きな折れ
    - 大きな傷
    - 傷多数
    - 水濡れ
    - ジャンク品

